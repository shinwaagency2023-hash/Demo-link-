demo(){TR=DS;TT='Guided demo';dgo(0)},autotour(){TR=AS;TT='See How Shinwa OS Automates Your Business';dgo(0)},pick(){V.au=id;V.nd=null;render()},node(){V.nd=+id;render()},viewrun(){V.vr=id;render()},run(){runAuto(el.closest('[data-t]').dataset.t)},quote(){form('Request a quotation (demo only: nothing is sent)',[['name','Your name','text',0,1],['email','Email','email',0,1],['biz','Business name','text'],['what','What would you like to automate?','textarea']],{},o=>toast('Demo only: no request was sent'))},dnext(){dgo(dstep+1)},dprev(){dgo(Math.max(0,dstep-1))},dexit(){dgo(-1)},
bell(){const p=$('#pop');if(p.innerHTML){p.innerHTML='';return}const n=[...S.auto.notes.slice(-5).reverse().map(x=>'[Simulated] '+x.txt),...S.tickets.filter(over).map(t=>t.tid+' is overdue: '+t.subject),...S.tickets.filter(t=>t.status=='New').map(t=>'New ticket '+t.tid+': '+t.subject),...S.tasks.filter(t=>!t.done&&t.due<day(0)).map(t=>'Task overdue: '+t.title)];p.innerHTML=`<div class="pop"><b>Sample notifications</b>${n.map(x=>`<div class="mu" style="padding:4px 0">${esc(x)}</div>`).join('')||'<p class="mu">All clear.</p>'}</div>`},
})[a]()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a)return;if(a.dataset.a!='bell'&&a.dataset.a!='user')$('#pop').innerHTML='';act(a.dataset.a,a.dataset.id,a)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')modal('');if(e.key=='Enter'&&['TR','DIV','B'].includes(e.target.tagName)&&e.target.dataset.a)act(e.target.dataset.a,e.target.dataset.id,e.target)});
document.addEventListener('change',e=>{const c=e.target.dataset.c,v=e.target.value,id=e.target.dataset.id;if(!c)return;
if(c=='mv'){const l=S.leads.find(x=>x.id==id);logL(l,'Moved '+l.stage+' → '+v);l.stage=v;toast('Moved to '+v)}else if(c=='task'){S.tasks.find(x=>x.id==id).done=e.target.checked;toast('Task updated')}
else if(c=='tst'){const t=S.tickets.find(x=>x.id==id);t.notes.push({t:now(),txt:'Status: '+t.status+' → '+v});t.status=v;toast('Ticket '+v);tktView(id)}else if(c=='tas'){const t=S.tickets.find(x=>x.id==id);t.assignee=v;t.notes.push({t:now(),txt:'Assigned to '+v});toast('Assigned to '+v);tktView(id)}else V[c]=v;save();if(c!='tst'&&c!='tas')render()});
document.addEventListener('submit',e=>{const f=e.target.dataset.f;if(!f)return;e.preventDefault();const id=e.target.dataset.id,v=e.target.n.value.trim();if(!v)return;if(f=='lnote'){const l=S.leads.find(x=>x.id==id);logL(l,v);leadDetail(id)}else{S.tickets.find(x=>x.id==id).notes.push({t:now(),txt:v});tktView(id)}save();render();toast('Note added')});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.lc');if(c)e.dataTransfer.setData('text/plain',c.dataset.id)});document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('.col'))e.preventDefault()});
document.addEventListener('drop',e=>{const c=e.target.closest('.col');if(!c)return;e.preventDefault();const l=S.leads.find(x=>x.id==e.dataTransfer.getData('text/plain'));if(l&&l.stage!=c.dataset.s){logL(l,'Moved '+l.stage+' → '+c.dataset.s);l.stage=c.dataset.s;save();render();toast('Moved to '+l.stage)}});
$('#q').addEventListener('input',()=>{if(V.v=='dash')V.v='leads';if(V.v=='client')V.v='clients';render()});render();
